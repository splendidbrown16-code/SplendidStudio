<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>More — Splendid Studio</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        type="module"
        src="vendor/ionicons/ionicons.esm.js"
    ></script>

    <script
        nomodule
        src="vendor/ionicons/ionicons.js"
    ></script>
</head>


<body>

    <main class="more-screen">

        <div class="more-title">
            More
        </div>


        <div class="more-section">

            <div class="more-section-title">
                STUDIO
            </div>

            <a
                href="services.html"
                class="more-link"
            >
                <ion-icon name="grid-outline"></ion-icon>

                <span>
                    Our Services
                </span>

                <ion-icon
                    name="chevron-forward-outline"
                    class="more-chevron"
                ></ion-icon>
            </a>


            <a
                href="about.html"
                class="more-link"
            >
                <ion-icon name="information-circle-outline"></ion-icon>

                <span>
                    About Splendid Studio
                </span>

                <ion-icon
                    name="chevron-forward-outline"
                    class="more-chevron"
                ></ion-icon>
            </a>


            <a
                href="how-it-works.html"
                class="more-link"
            >
                <ion-icon name="help-circle-outline"></ion-icon>

                <span>
                    How It Works
                </span>

                <ion-icon
                    name="chevron-forward-outline"
                    class="more-chevron"
                ></ion-icon>
            </a>

        </div>


        <div class="more-section">

            <div class="more-section-title">
                SUPPORT
            </div>

            <a
                href="contact.html"
                class="more-link"
            >
                <ion-icon name="chatbubble-ellipses-outline"></ion-icon>

                <span>
                    Contact Us
                </span>

                <ion-icon
                    name="chevron-forward-outline"
                    class="more-chevron"
                ></ion-icon>
            </a>


            <a
                href="help-support.html"
                class="more-link"
            >
                <ion-icon name="headset-outline"></ion-icon>

                <span>
                    Help & Support
                </span>

                <ion-icon
                    name="chevron-forward-outline"
                    class="more-chevron"
                ></ion-icon>
            </a>

        </div>


        <div class="more-section">

            <div class="more-section-title">
                INFORMATION
            </div>

            <a
                href="terms.html"
                class="more-link"
            >
                <ion-icon name="document-text-outline"></ion-icon>

                <span>
                    Terms & Conditions
                </span>

                <ion-icon
                    name="chevron-forward-outline"
                    class="more-chevron"
                ></ion-icon>
            </a>


            <a
                href="privacy.html"
                class="more-link"
            >
                <ion-icon name="shield-checkmark-outline"></ion-icon>

                <span>
                    Privacy Policy
                </span>

                <ion-icon
                    name="chevron-forward-outline"
                    class="more-chevron"
                ></ion-icon>
            </a>

        </div>


        <div class="more-version">
            Splendid Studio · Version 1.0
        </div>

    </main>


    <nav
        class="mobile-tab-bar"
        aria-label="Customer navigation"
    >

        <a
            href="dashboard.html"
            class="mobile-tab"
        >
            <ion-icon name="home-outline"></ion-icon>
            <span>Home</span>
        </a>


        <a
            href="services.html"
            class="mobile-tab"
        >
            <ion-icon name="grid-outline"></ion-icon>
            <span>Services</span>
        </a>


        <a
            href="orders.html"
            class="mobile-tab"
        >
            <ion-icon name="receipt-outline"></ion-icon>
            <span>Orders</span>
        </a>


        <a
            href="account.html"
            class="mobile-tab"
        >
            <ion-icon name="person-outline"></ion-icon>
            <span>Account</span>
        </a>


        <a
            href="more.html"
            class="mobile-tab active"
        >
            <ion-icon name="ellipsis-horizontal"></ion-icon>
            <span>More</span>
        </a>

    </nav>

</body>

</html>
