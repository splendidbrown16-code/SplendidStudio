<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Splendid Studio</title>
    <meta name="description" content="Log in to your Splendid Studio customer account.">

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="index.html" class="auth-logo">
            <span class="logo-mark">S</span>
            <span>Splendid<span>Studio</span></span>
        </a>

        <section class="auth-card">

            <div class="auth-header">
                <span class="auth-badge">✦ CUSTOMER ACCOUNT</span>

                <h1>Welcome back.</h1>

                <p>
                    Log in to manage your orders, track your projects
                    and continue working with Splendid Studio.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">

                    <div class="login-password-label">
                        <label for="password">Password</label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>
                    </div>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <label class="remember-check">
                    <input type="checkbox" id="remember">

                    <span>Remember me on this device</span>
                </label>

                <button type="submit" class="auth-submit">
                    Log In
                    <span>→</span>
                </button>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="signup.html">Create one</a>
                </p>

            </form>

        </section>

        <p class="auth-footer">
            © 2026 Splendid Studio · Design • Print • Deliver
        </p>

    </main>



<script src="login.js"></script>
<script src="script.js"></script>
</body>
</html>
